name: Deploy to GitHub Pages

# Publishes the site on every push to main (and lets you trigger it manually).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The site is static (no build step), but the repo root is not the site.
      # It also carries the SiteGround PHP backend, and Pages served that source
      # from the family's own domain — harmless in itself, since the repo is
      # public and the file holding credentials is gitignored, but it is not
      # something the site needs, and .php served as text here would EXECUTE on
      # a host whose document root sat at the repo root. Stage what the site
      # actually loads instead.
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git' \
            --exclude '_site' \
            --exclude 'siteground' \
            ./ _site/
          echo "staged:"; ls -A _site

      # Point the old address at the new one. The family moved to
      # https://zupu.accme.my on 2026-08-30 because github.io is blocked in
      # mainland China and relatives there could not reach the site at all.
      #
      # Only what Pages PUBLISHES is replaced: index.html stays the app in git,
      # because tools/deploy_frontend.sh copies that same file to SiteGround as
      # the real site. Deleting this step restores the old site exactly.
      #
      # The rest of _site is left in place on purpose, so existing deep links to
      # the transcription pages and page scans keep resolving.
      - name: Point the old address at the new one
        run: |
          cp pages-moved.html _site/index.html
          rm -f _site/pages-moved.html
          echo "published redirect in place of the app:"
          grep -o '<title>.*</title>' _site/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
